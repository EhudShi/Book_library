<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הספרייה שלי</title>
<meta name="description" content="סיכומי ספרים בעברית">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="הספרייה">
<meta name="theme-color" content="#EAF5FA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* Home: a daily flashcard on top (the one bold element), then a quiet list of books with how much of each book's steps were applied. */
.wrap{max-width:720px;margin:0 auto;padding-block:32px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0}
.streak{background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.streak[hidden]{display:none}

/* The one bold element: a flashcard. Front asks, tap flips, back answers. */
.daily{perspective:1400px}
.flip{display:grid;position:relative}
.face{grid-area:1/1;border-radius:22px;padding:24px 22px 20px;display:flex;flex-direction:column;gap:14px;min-height:220px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:var(--primary);color:var(--on-primary);box-shadow:0 10px 0 -4px color-mix(in srgb,var(--primary) 60%,transparent),0 18px 0 -8px color-mix(in srgb,var(--primary) 30%,transparent)}
.back{background:var(--surface);color:var(--fg);border-top:8px solid var(--highlight);transform:rotateY(180deg);box-shadow:0 10px 0 -4px var(--track),0 18px 0 -8px color-mix(in srgb,var(--track) 60%,transparent)}
.flip.on .front{transform:rotateY(-180deg)}
.flip.on .back{transform:rotateY(0)}
@media (prefers-reduced-motion:no-preference){.face{transition:transform .55s cubic-bezier(.2,.7,.2,1)}}
@media (prefers-reduced-motion:reduce){.flip.on .front{visibility:hidden}.flip:not(.on) .back{visibility:hidden}}
.serif{font-family:var(--serif)}
.front .q{margin:0;font-size:clamp(23px,5.4vw,30px);font-weight:700;line-height:1.3;text-wrap:balance}
.front .src{font-size:15px;opacity:.85}
.back .idea{margin:0;font-size:clamp(22px,5vw,28px);font-weight:500;line-height:1.4;text-wrap:pretty}
.back .src{font-size:14px;color:var(--muted)}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto}
.act button,.act a{font:inherit;font-size:15px;font-weight:500;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;text-decoration:none;color:inherit;background:var(--chip)}
.front .act button{background:var(--on-primary);color:var(--primary);font-weight:700}
.act .yes{background:var(--highlight);color:var(--on-highlight);font-weight:700}
.act a{background:none;color:var(--muted);margin-inline-start:auto;padding-inline:4px}
.act a:hover{color:var(--fg)}
.front :focus-visible{outline-color:var(--on-primary)}

.tools{display:flex;flex-direction:column;gap:10px}
.search{font:inherit;font-size:16px;padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;font-weight:500;padding:5px 14px;border-radius:999px;border:0;background:var(--chip);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.list-head{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--muted);padding-bottom:4px}
.list-head b{color:var(--fg);font-weight:700}
/* Quiet list: rows split by hairlines, each book marked by its spine color. */
.row{display:grid;grid-template-columns:6px minmax(0,1fr);gap:2px 14px;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:hover h2{text-decoration:underline;text-decoration-color:var(--highlight);text-decoration-thickness:3px;text-underline-offset:5px}
.spine{grid-row:span 3;border-radius:3px}
.row h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:700;line-height:1.3;text-wrap:balance}
.row .by{color:var(--muted);font-size:14px}
.row .prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.row .prog .bar{flex:1;max-width:200px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>הספרייה שלי</h1>
    <span class="streak" id="streak" hidden></span>
  </header>

  <section class="daily" aria-label="כרטיס הזיכרון של היום">
    <div class="flip" id="flip">
      <div class="face front" id="front">
        <p class="q serif" id="d-q">...</p>
        <span class="src" id="d-book"></span>
        <div class="act"><button type="button" id="d-flip">לגלות את התשובה</button></div>
      </div>
      <div class="face back" id="back" aria-live="polite">
        <p class="idea serif" id="d-text"></p>
        <span class="src" id="d-book2"></span>
        <div class="act">
          <button type="button" class="yes" id="d-done">זכרתי</button>
          <button type="button" id="d-next">עוד לא</button>
          <a id="d-link" href="#">לפרק המלא</a>
        </div>
      </div>
    </div>
  </section>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="חיפוש ספר, סופר או נושא" aria-label="חיפוש">
    <div class="chips" id="chips" role="group" aria-label="סינון לפי נושא"></div>
  </div>

  <div>
    <div class="list-head"><b>הספרים שלי</b><span id="count"></span></div>
    <div id="grid"></div>
  </div>
  <footer>נבנה עם Claude</footer>
</div>

<script src="books.js"></script>
<script>
(function(){
  var books = window.BOOKS || [];
  var store = {
    get: function(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
    set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  function esc(s){ return String(s || '').replace(/[&<>"]/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; }); }
  var today = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);

  // ---------- Streak: consecutive days this browser opened the library ----------
  var st = store.get('lib:streak') || { last: 0, n: 0 };
  if (st.last !== today){ st.n = st.last === today - 1 ? st.n + 1 : 1; st.last = today; store.set('lib:streak', st); }
  if (st.n >= 2){ var s = document.getElementById('streak'); s.textContent = st.n + ' ימים ברצף'; s.hidden = false; }

  // ---------- Daily flashcard: questions come from the chapters of one book page at a time ----------
  var cache = {}, remembered = store.get('lib:remembered') || {};
  var bi = books.length ? today % books.length : 0, ii = today, tries = 0;
  var flip = document.getElementById('flip'), front = document.getElementById('front'), back = document.getElementById('back');
  var dQ = document.getElementById('d-q'), dText = document.getElementById('d-text'), dLink = document.getElementById('d-link');
  var dBook = document.getElementById('d-book'), dBook2 = document.getElementById('d-book2');

  function ideasOf(b){
    if (cache[b.slug]) return Promise.resolve(cache[b.slug]);
    return fetch('books/' + b.slug + '.html').then(function(r){ return r.text(); }).then(function(html){
      var doc = new DOMParser().parseFromString(html, 'text/html'), list = [];
      Array.prototype.forEach.call(doc.querySelectorAll('.wrap section'), function(sec, si){
        var h = sec.querySelector('h2'), t = h ? h.textContent.replace(/^\s*\d+\s*/, '').trim() : '';
        Array.prototype.forEach.call(sec.querySelectorAll('.key'), function(k){ list.push({ text: k.textContent.trim(), chapter: t, id: sec.id || 's' + (si + 1) }); });
      });
      return cache[b.slug] = list.length ? list : [{ text: b.blurb, chapter: '', id: '' }];
    }).catch(function(){ return cache[b.slug] = [{ text: b.blurb, chapter: '', id: '' }]; });
  }
  function setFlipped(on){
    flip.classList.toggle('on', on);
    front.inert = on; back.inert = !on;
    if (on) document.getElementById('d-done').focus({ preventScroll: true });
  }
  function show(){
    if (!books.length){ dQ.textContent = 'כשיתווסף ספר ראשון, יופיע כאן כרטיס.'; document.getElementById('d-flip').hidden = true; return; }
    var b = books[bi];
    ideasOf(b).then(function(list){
      var i = ii % list.length, it = list[i];
      // Skip ideas already marked "remembered", unless everything is remembered.
      if (remembered[b.slug + ':' + i] && tries < 40){ tries++; next(); return; }
      tries = 0;
      dQ.textContent = it.chapter ? 'מה הרעיון המרכזי בפרק "' + it.chapter + '"?' : 'במה עוסק הספר?';
      dBook.textContent = dBook2.textContent = b.title;
      dText.textContent = it.text;
      dLink.href = 'books/' + b.slug + '.html' + (it.id ? '#' + it.id : '');
      dText.dataset.k = b.slug + ':' + i;
    });
  }
  function next(){ bi = (bi + 1) % books.length; if (bi === today % books.length) ii++; show(); }
  function advance(){ setFlipped(false); tries = 0; setTimeout(next, matchMedia('(prefers-reduced-motion:reduce)').matches ? 0 : 280); }
  document.getElementById('d-flip').onclick = function(){ setFlipped(true); };
  document.getElementById('d-next').onclick = advance;
  document.getElementById('d-done').onclick = function(){
    if (dText.dataset.k){ remembered[dText.dataset.k] = today; store.set('lib:remembered', remembered); }
    advance();
  };
  setFlipped(false);
  show();

  // ---------- Book list with search, topic filter and applied-steps progress ----------
  var grid = document.getElementById('grid'), q = document.getElementById('q'), chips = document.getElementById('chips'), count = document.getElementById('count');
  var active = 'הכול';
  var cats = ['הכול'].concat(books.map(function(b){ return b.category; }).filter(function(c, i, a){ return c && a.indexOf(c) === i; }));
  cats.forEach(function(c){
    var btn = document.createElement('button');
    btn.className = 'chip'; btn.type = 'button'; btn.textContent = c;
    btn.onclick = function(){ active = c; render(); };
    chips.appendChild(btn);
  });

  function render(){
    var term = q.value.trim().toLowerCase();
    Array.prototype.forEach.call(chips.children, function(b){ b.setAttribute('aria-pressed', b.textContent === active); });
    var list = books.filter(function(b){
      if (active !== 'הכול' && b.category !== active) return false;
      if (!term) return true;
      return [b.title, b.original, b.author, b.category, b.blurb].join(' ').toLowerCase().indexOf(term) !== -1;
    });
    count.textContent = list.length === 1 ? 'ספר אחד' : list.length + ' ספרים';
    grid.innerHTML = list.length ? list.map(function(b){
      var p = store.get('lib:progress:' + b.slug);
      var pct = p && p.total ? Math.round(100 * p.done / p.total) : 0;
      var label = p && p.total ? (p.done === p.total ? 'הכול יושם' : p.done + ' מתוך ' + p.total + ' צעדים') : 'עוד לא התחלת';
      return '<a class="row" href="books/' + esc(b.slug) + '.html">' +
        '<span class="spine" style="background:' + esc(b.color) + '" aria-hidden="true"></span>' +
        '<h2>' + esc(b.title) + '</h2>' +
        '<span class="by">' + esc(b.author) + '</span>' +
        '<span class="prog"><span class="bar"><i style="width:' + pct + '%"></i></span>' + label + '</span>' +
        '</a>';
    }).join('') : '<div class="empty">לא נמצאו ספרים</div>';
  }
  q.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
