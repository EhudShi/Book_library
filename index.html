<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הספרייה שלי</title>
<meta name="description" content="סיכומי ספרים בעברית">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="assets/theme.css">
<style>
/* Home: "idea of the day" card on top, then the book list with how much of each book's steps were applied. */
.wrap{max-width:720px;margin:0 auto;padding-block:32px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-weight:800;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0}
.streak{background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--leaf);font-variant-numeric:tabular-nums}
.streak[hidden]{display:none}

.daily{position:relative;background:var(--leaf);color:var(--leaf-ink);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 10px 0 -4px color-mix(in srgb,var(--leaf) 45%,transparent),0 18px 0 -8px color-mix(in srgb,var(--leaf) 22%,transparent)}
.daily small{font-size:14px;font-weight:500;opacity:.85}
.daily p{margin:0;font-size:clamp(20px,4.6vw,26px);font-weight:700;line-height:1.35;text-wrap:pretty;min-height:2.7em}
.daily .act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.daily button,.daily a{font:inherit;font-size:14px;font-weight:500;border:0;border-radius:999px;padding:6px 14px;cursor:pointer;text-decoration:none;
  background:color-mix(in srgb,var(--leaf-ink) 16%,transparent);color:inherit}
.daily button:hover,.daily a:hover{background:color-mix(in srgb,var(--leaf-ink) 26%,transparent)}
.daily .done{background:var(--sun);color:#1d2b24}
.daily .done:hover{background:#f5d56e}
.daily :focus-visible{outline-color:var(--leaf-ink)}
.daily a{margin-inline-start:auto}

.tools{display:flex;flex-direction:column;gap:10px}
.search{font:inherit;font-size:16px;padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;font-weight:500;padding:5px 14px;border-radius:999px;border:0;background:var(--chip);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.list{display:flex;flex-direction:column;gap:10px}
.list-head{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:var(--muted)}
.list-head b{color:var(--fg);font-weight:700}
.row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:4px 14px;align-items:center;background:var(--surface);border-radius:18px;padding:14px;text-decoration:none;color:inherit}
.row:hover{box-shadow:var(--shadow)}
.ic{grid-row:span 3;align-self:start;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.row h2{margin:0;font-size:18px;font-weight:700;line-height:1.3;text-wrap:balance}
.row .by{color:var(--muted);font-size:14px}
.row .by bdi{direction:ltr}
.row .prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
.row .prog .bar{flex:1}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>הספרייה שלי</h1>
    <span class="streak" id="streak" hidden></span>
  </header>

  <section class="daily" id="daily" aria-live="polite">
    <small id="d-src">רעיון היום</small>
    <p id="d-text">...</p>
    <div class="act">
      <button type="button" class="done" id="d-done">זוכר</button>
      <button type="button" id="d-next">עוד רעיון</button>
      <a id="d-link" href="#">לסיכום המלא</a>
    </div>
  </section>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="חיפוש ספר, סופר או נושא" aria-label="חיפוש">
    <div class="chips" id="chips" role="group" aria-label="סינון לפי נושא"></div>
  </div>

  <div class="list">
    <div class="list-head"><b>הספרים שלי</b><span id="count"></span></div>
    <div class="list" id="grid"></div>
  </div>
  <footer>נבנה עם Claude</footer>
</div>

<script src="books.js"></script>
<script>
(function(){
  var books = window.BOOKS || [];
  var store = {
    get: function(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
    set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  function esc(s){ return String(s || '').replace(/[&<>"]/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; }); }
  var today = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);

  // ---------- Streak: consecutive days this browser opened the library ----------
  var st = store.get('lib:streak') || { last: 0, n: 0 };
  if (st.last !== today){ st.n = st.last === today - 1 ? st.n + 1 : 1; st.last = today; store.set('lib:streak', st); }
  if (st.n >= 2){ var s = document.getElementById('streak'); s.textContent = st.n + ' ימים ברצף'; s.hidden = false; }

  // ---------- Idea of the day: read the .key lines from one book page at a time ----------
  var cache = {}, remembered = store.get('lib:remembered') || {};
  var bi = books.length ? today % books.length : 0, ii = today, tries = 0;
  var dSrc = document.getElementById('d-src'), dText = document.getElementById('d-text'), dLink = document.getElementById('d-link');

  function ideasOf(b){
    if (cache[b.slug]) return Promise.resolve(cache[b.slug]);
    return fetch('books/' + b.slug + '.html').then(function(r){ return r.text(); }).then(function(html){
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var list = Array.prototype.map.call(doc.querySelectorAll('.key'), function(k){ return k.textContent.trim(); });
      return cache[b.slug] = list.length ? list : [b.blurb];
    }).catch(function(){ return cache[b.slug] = [b.blurb]; });
  }
  function show(){
    if (!books.length){ dText.textContent = 'עוד אין ספרים בספרייה.'; return; }
    var b = books[bi];
    ideasOf(b).then(function(list){
      var i = ii % list.length, text = list[i];
      // Skip ideas already marked "remembered", unless everything is remembered.
      if (remembered[b.slug + ':' + i] && tries < 40){ tries++; next(); return; }
      tries = 0;
      dSrc.textContent = 'רעיון היום · ' + b.title;
      dText.textContent = text;
      dLink.href = 'books/' + b.slug + '.html';
      dText.dataset.k = b.slug + ':' + i;
    });
  }
  function next(){ bi = (bi + 1) % books.length; if (bi === today % books.length) ii++; show(); }
  document.getElementById('d-next').onclick = function(){ tries = 0; next(); };
  document.getElementById('d-done').onclick = function(){
    if (dText.dataset.k){ remembered[dText.dataset.k] = today; store.set('lib:remembered', remembered); }
    tries = 0; next();
  };
  show();

  // ---------- Book list with search, topic filter and applied-steps progress ----------
  var grid = document.getElementById('grid'), q = document.getElementById('q'), chips = document.getElementById('chips'), count = document.getElementById('count');
  var active = 'הכול';
  var cats = ['הכול'].concat(books.map(function(b){ return b.category; }).filter(function(c, i, a){ return c && a.indexOf(c) === i; }));
  cats.forEach(function(c){
    var btn = document.createElement('button');
    btn.className = 'chip'; btn.type = 'button'; btn.textContent = c;
    btn.onclick = function(){ active = c; render(); };
    chips.appendChild(btn);
  });

  function render(){
    var term = q.value.trim().toLowerCase();
    Array.prototype.forEach.call(chips.children, function(b){ b.setAttribute('aria-pressed', b.textContent === active); });
    var list = books.filter(function(b){
      if (active !== 'הכול' && b.category !== active) return false;
      if (!term) return true;
      return [b.title, b.original, b.author, b.category, b.blurb].join(' ').toLowerCase().indexOf(term) !== -1;
    });
    count.textContent = list.length === 1 ? 'ספר אחד' : list.length + ' ספרים';
    grid.innerHTML = list.length ? list.map(function(b){
      var p = store.get('lib:progress:' + b.slug);
      var pct = p && p.total ? Math.round(100 * p.done / p.total) : 0;
      var label = p && p.total ? (p.done === p.total ? 'הכול יושם' : p.done + ' מתוך ' + p.total + ' צעדים') : 'עוד לא התחלת';
      return '<a class="row" href="books/' + esc(b.slug) + '.html">' +
        '<span class="ic" style="background:' + esc(b.color) + '" aria-hidden="true">' + esc((b.title || '?').charAt(0)) + '</span>' +
        '<h2>' + esc(b.title) + '</h2>' +
        '<span class="by">' + esc(b.category) + ' · ' + esc(b.author) + '</span>' +
        '<span class="prog"><span class="bar"><i style="width:' + pct + '%"></i></span>' + label + '</span>' +
        '</a>';
    }).join('') : '<div class="empty">לא נמצאו ספרים</div>';
  }
  q.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
