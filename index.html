<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>הספרייה שלי</title>
<meta name="description" content="סיכומי ספרים בעברית">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f7f6f3; --surface:#ffffff; --fg:#22201d; --muted:#665f58; --line:#e2ddd6; --chip:#efece7;
  --shelf:#d9d2c7;
  --display:"Rubik","Assistant",system-ui,sans-serif;
  --body:"Assistant","Rubik",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#181614; --surface:#211e1b; --fg:#ece8e3; --muted:#a59d94; --line:#34302b; --chip:#2b2723; --shelf:#3a352f; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181614; --surface:#211e1b; --fg:#ece8e3; --muted:#a59d94; --line:#34302b; --chip:#2b2723; --shelf:#3a352f; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding-block:48px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:32px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,52px);line-height:1.1;margin:0}
header{display:flex;flex-direction:column;gap:10px}
header p{margin:0;color:var(--muted);font-size:18px}
.spines{display:flex;gap:6px;align-items:flex-end;height:64px;padding:0 4px;border-bottom:6px solid var(--shelf);margin-top:8px}
.spines span{width:18px;border-radius:3px 3px 0 0;opacity:.9}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{flex:1 1 220px;font:inherit;font-size:16px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.search:focus{outline:2px solid var(--fg);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{display:flex;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgb(0 0 0 / .08)}
.card:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.spine{flex:none;width:14px}
.body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cat{font-size:13px;font-weight:700;letter-spacing:.02em}
.card h2{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.25;margin:0;text-wrap:balance}
.by{color:var(--muted);font-size:14px}
.by bdi{font-style:italic}
.blurb{margin:0;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{color:var(--muted);font-size:14px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>הספרייה שלי</h1>
    <p>סיכומי ספרים בעברית: הרעיונות המרכזיים, ציטוטים וצעדים לנסות.</p>
    <div class="spines" id="spines" aria-hidden="true"></div>
  </header>

  <div class="tools">
    <input class="search" id="q" type="search" placeholder="חיפוש ספר, סופר או נושא" aria-label="חיפוש">
    <div class="chips" id="chips" role="group" aria-label="סינון לפי נושא"></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <footer>נבנה עם Claude</footer>
</div>

<script src="books.js"></script>
<script>
(function(){
  var books = window.BOOKS || [];
  var grid = document.getElementById('grid');
  var q = document.getElementById('q');
  var chips = document.getElementById('chips');
  var count = document.getElementById('count');
  var active = 'הכול';

  // Decorative shelf: one spine per book, varied heights
  var spines = document.getElementById('spines');
  books.forEach(function(b, i){
    var s = document.createElement('span');
    s.style.background = b.color;
    s.style.height = (70 + (i * 37) % 30) + '%';
    spines.appendChild(s);
  });

  var cats = ['הכול'].concat(books.map(function(b){return b.category}).filter(function(c, i, a){return c && a.indexOf(c) === i}));
  cats.forEach(function(c){
    var btn = document.createElement('button');
    btn.className = 'chip'; btn.type = 'button'; btn.textContent = c;
    btn.setAttribute('aria-pressed', c === active);
    btn.onclick = function(){ active = c; render(); };
    chips.appendChild(btn);
  });

  function esc(s){ return String(s || '').replace(/[&<>"]/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; }); }

  function render(){
    var term = q.value.trim().toLowerCase();
    Array.prototype.forEach.call(chips.children, function(b){ b.setAttribute('aria-pressed', b.textContent === active); });
    var list = books.filter(function(b){
      if (active !== 'הכול' && b.category !== active) return false;
      if (!term) return true;
      return [b.title, b.original, b.author, b.category, b.blurb].join(' ').toLowerCase().indexOf(term) !== -1;
    });
    count.textContent = list.length === 1 ? 'ספר אחד' : list.length + ' ספרים';
    grid.innerHTML = list.length ? list.map(function(b){
      return '<a class="card" href="books/' + esc(b.slug) + '.html">' +
        '<span class="spine" style="background:' + esc(b.color) + '"></span>' +
        '<div class="body">' +
          '<span class="cat" style="color:' + esc(b.color) + '">' + esc(b.category) + '</span>' +
          '<h2>' + esc(b.title) + '</h2>' +
          '<span class="by">' + esc(b.author) + ' · <bdi dir="ltr">' + esc(b.original) + '</bdi></span>' +
          '<p class="blurb">' + esc(b.blurb) + '</p>' +
        '</div></a>';
    }).join('') : '<div class="empty">לא נמצאו ספרים</div>';
  }
  q.addEventListener('input', render);
  render();
})();
</script>
</body>
</html>
